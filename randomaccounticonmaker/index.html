var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
var input = document.getElementById("textInput");
var download = document.getElementById("download");

var FONT_FAMILY = "OCR10BT";
var CANVAS_WIDTH = 600;
var CANVAS_HEIGHT = 600;
var MAX_WIDTH = 560;
var MIN_FONT_SIZE = 10;
var MAX_FONT_SIZE = 72;

var template = new Image();

function warmUpFont() {
    ctx.font = '72px "OCR10BT"';
    ctx.measureText("0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ");
}

warmUpFont();

template.onload = function () {
    generateImage();
};

template.src = TEMPLATE;

function generateImage() {
    var text;
    var fontSize;
    var font;

    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // 模板
    ctx.drawImage(
        template,
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );

    text = input.value.replace(/^\s+|\s+$/g, "");

    if (!text) {
        return;
    }

    // 自動縮小字體
    fontSize = MAX_FONT_SIZE;

    while (fontSize > MIN_FONT_SIZE) {
        font = fontSize + 'px "' + FONT_FAMILY + '"';
        ctx.font = font;

        if (ctx.measureText(text).width <= MAX_WIDTH) {
            break;
        }

        fontSize--;
    }

    // 最終字體
    ctx.font = fontSize + 'px "' + FONT_FAMILY + '"';
    ctx.fillStyle = "#39c5bb";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // 白色區域中央
    ctx.fillText(text, 300, 560);
}

input.addEventListener("input", generateImage);

download.addEventListener("click", function () {
    var a = document.createElement("a");
    var text = input.value.replace(/^\s+|\s+$/g, "");

    if (!text) {
        alert("請先輸入文字！");
        return;
    }

    a.download = text + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
});
    </script>

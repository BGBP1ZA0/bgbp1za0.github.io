    <script>
        // 同一時間只播放一首：任何一個 <audio> 開始播放時，暫停其他所有的
        // play 事件不冒泡，所以必須用捕獲階段（第三個參數 true）在 document 上統一監聽
        (function () {
            var currentAudio = null;

            function onPlay(e) {
                var target = e.target;
                if (!target || target.tagName !== 'AUDIO') return;

                if (currentAudio && currentAudio !== target) {
                    currentAudio.pause();
                }
                currentAudio = target;
            }

            if (document.addEventListener) {
                document.addEventListener('play', onPlay, true);
            }
        })();
    </script>
</head>
